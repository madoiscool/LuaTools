name: Build and test

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build LuaToolsGui.sln -c Release

      - name: Test
        run: dotnet test LuaToolsGui.sln -c Release --no-build
